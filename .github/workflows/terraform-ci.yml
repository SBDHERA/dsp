name: Terraform CI/CD

on:
  push:
    branches:
      - development
      - staging
      - main
  pull_request:
    branches:
      - development
      - staging
      - main

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init
      env:
        TF_WORKSPACE: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'production' || github.base_ref) || (github.ref_name == 'main' && 'production' || github.ref_name) }}

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan
      env:
        TF_WORKSPACE: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'production' || github.base_ref) || (github.ref_name == 'main' && 'production' || github.ref_name) }}

  terraform-apply:
    name: 'Terraform Apply'
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init
      env:
        TF_WORKSPACE: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}

    - name: Terraform Apply
      run: terraform apply -auto-approve
      env:
        TF_WORKSPACE: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}